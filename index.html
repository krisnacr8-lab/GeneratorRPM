<!DOCTYPE html>
<html lang="id" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPM AI Generator Kurikulum Merdeka</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'], serif: ['Playfair Display', 'serif'] },
                    colors: { primary: '#2563EB', secondary: '#4F46E5', success: '#22C55E', bgLight: '#F8FAFC', bgDark: '#0F172A', cardDark: '#1E293B' }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.18); }
        .dark .glass { background: rgba(30, 41, 59, 0.7); border: 1px solid rgba(255, 255, 255, 0.05); }

        .doc-preview { font-family: 'Times New Roman', Times, serif; color: black; background: white; line-height: 1.5; font-size: 11pt; }
        .doc-preview table { width: 100%; border-collapse: collapse; margin-bottom: 1.5rem; }
        .doc-preview th, .doc-preview td { border: 1px solid #000; padding: 8px 12px; vertical-align: top; }
        .doc-preview th { background-color: #f3f4f6; font-weight: bold; }
        .doc-preview .header-col { background-color: #f4f6f9; font-weight: bold; width: 30%; }
        .doc-preview h1 { font-size: 16pt; text-align: center; font-weight: bold; margin-bottom: 0.5rem; }
        .doc-preview h2 { font-size: 14pt; font-weight: bold; margin-top: 1.5rem; margin-bottom: 0.5rem; text-transform: uppercase; }
        .doc-preview h3 { font-size: 12pt; font-weight: bold; margin-top: 1.5rem; margin-bottom: 0.5rem; }
        .doc-preview p { margin-bottom: 0.5rem; text-align: justify; }
        .doc-preview ul, .doc-preview ol { padding-left: 20px; margin-top: 0.2rem; margin-bottom: 0.5rem; }

        @media print {
            body * { visibility: hidden; }
            #preview-container, #preview-container * { visibility: visible; }
            #preview-container { position: absolute; left: 0; top: 0; width: 100%; background: white; padding: 0; margin: 0; box-shadow: none; }
            @page { margin: 2cm; }
        }
    </style>
</head>
<body class="bg-bgLight dark:bg-bgDark text-gray-800 dark:text-gray-200 transition-colors duration-300 min-h-screen">

    <header class="glass sticky top-0 z-50 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="bg-gradient-to-r from-primary to-secondary text-white p-2 rounded-lg"><i class="fas fa-brain"></i></div>
                <div>
                    <h1 class="font-bold text-lg md:text-xl tracking-tight">RPM AI GENERATOR</h1>
                    <p class="text-xs text-gray-500 dark:text-gray-400 font-medium">Kurikulum Merdeka • Deep Learning</p>
                </div>
            </div>
            <button id="themeToggle" class="p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700 transition">
                <i class="fas fa-moon dark:hidden"></i><i class="fas fa-sun hidden dark:block text-yellow-400"></i>
            </button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            
            <div class="lg:col-span-5 space-y-6 h-[calc(100vh-8rem)] overflow-y-auto pr-2 pb-20">
                
                <!-- 1. IDENTITAS -->
                <div class="bg-white dark:bg-cardDark rounded-2xl shadow-sm p-6 border border-gray-100 dark:border-gray-800">
                    <h2 class="text-lg font-bold mb-4 flex items-center gap-2"><i class="fas fa-user-tie text-primary"></i> IDENTITAS GURU</h2>
                    <div class="space-y-4">
                        <div><label class="block text-xs font-semibold mb-1">Nama Guru</label><input type="text" id="namaGuru" class="w-full rounded-lg border-gray-300 bg-gray-50 dark:bg-gray-700 p-2.5 text-sm dark:text-white" placeholder="Budi Santoso, S.Pd."></div>
                        <div><label class="block text-xs font-semibold mb-1">NIP Guru</label><input type="text" id="nipGuru" class="w-full rounded-lg border-gray-300 bg-gray-50 dark:bg-gray-700 p-2.5 text-sm dark:text-white" placeholder="19850723 201001 1 015"></div>
                        <div><label class="block text-xs font-semibold mb-1">Nama Kepala Sekolah</label><input type="text" id="namaKepsek" class="w-full rounded-lg border-gray-300 bg-gray-50 dark:bg-gray-700 p-2.5 text-sm dark:text-white" placeholder="Siti Aminah, M.Pd."></div>
                        <div><label class="block text-xs font-semibold mb-1">NIP Kepala Sekolah</label><input type="text" id="nipKepsek" class="w-full rounded-lg border-gray-300 bg-gray-50 dark:bg-gray-700 p-2.5 text-sm dark:text-white" placeholder="19700321 199512 2 001"></div>
                        <div><label class="block text-xs font-semibold mb-1">Nama Sekolah</label><input type="text" id="namaSekolah" class="w-full rounded-lg border-gray-300 bg-gray-50 dark:bg-gray-700 p-2.5 text-sm dark:text-white" placeholder="SMP Negeri 1 Merdeka"></div>
                    </div>
                </div>

                <!-- 2. INFORMASI AKADEMIK -->
                <div class="bg-white dark:bg-cardDark rounded-2xl shadow-sm p-6 border border-gray-100 dark:border-gray-800">
                    <h2 class="text-lg font-bold mb-4 flex items-center gap-2"><i class="fas fa-graduation-cap text-secondary"></i> INFORMASI AKADEMIK</h2>
                    <div class="grid grid-cols-2 gap-4">
                        <div class="col-span-2"><label class="block text-xs font-semibold mb-1">Mata Pelajaran</label><input type="text" id="mapel" class="w-full rounded-lg border-gray-300 bg-gray-50 dark:bg-gray-700 p-2.5 text-sm dark:text-white" placeholder="Ilmu Pengetahuan Alam (IPA)"></div>
                        <div><label class="block text-xs font-semibold mb-1">Jenjang</label><input type="text" id="jenjang" class="w-full rounded-lg border-gray-300 bg-gray-50 dark:bg-gray-700 p-2.5 text-sm dark:text-white" placeholder="SMP"></div>
                        <div><label class="block text-xs font-semibold mb-1">Fase</label><input type="text" id="fase" class="w-full rounded-lg border-gray-300 bg-gray-50 dark:bg-gray-700 p-2.5 text-sm dark:text-white" placeholder="D"></div>
                        <div><label class="block text-xs font-semibold mb-1">Kelas</label><input type="text" id="kelas" class="w-full rounded-lg border-gray-300 bg-gray-50 dark:bg-gray-700 p-2.5 text-sm dark:text-white" placeholder="VII"></div>
                        <div><label class="block text-xs font-semibold mb-1">Semester</label><input type="text" id="semester" class="w-full rounded-lg border-gray-300 bg-gray-50 dark:bg-gray-700 p-2.5 text-sm dark:text-white" placeholder="Ganjil"></div>
                        <div><label class="block text-xs font-semibold mb-1">Tahun Pelajaran</label><input type="text" id="tahunPel" class="w-full rounded-lg border-gray-300 bg-gray-50 dark:bg-gray-700 p-2.5 text-sm dark:text-white" placeholder="2025/2026"></div>
                        <div><label class="block text-xs font-semibold mb-1">Alokasi Waktu</label><input type="text" id="waktu" class="w-full rounded-lg border-gray-300 bg-gray-50 dark:bg-gray-700 p-2.5 text-sm dark:text-white" placeholder="2 x 45 Menit"></div>
                    </div>
                </div>

                <!-- 3. MATERI -->
                <div class="bg-white dark:bg-cardDark rounded-2xl shadow-sm p-6 border border-gray-100 dark:border-gray-800">
                    <h2 class="text-lg font-bold mb-4 flex items-center gap-2"><i class="fas fa-book-open text-success"></i> MATERI</h2>
                    <div class="space-y-4">
                        <div><label class="block text-xs font-semibold mb-1">Topik Materi</label><input type="text" id="topik" class="w-full rounded-lg border-gray-300 bg-gray-50 dark:bg-gray-700 p-2.5 text-sm dark:text-white" placeholder="Contoh: Struktur Tumbuhan"></div>
                        <div><label class="block text-xs font-semibold mb-1">Tujuan Pembelajaran</label><textarea id="tp" rows="3" class="w-full rounded-lg border-gray-300 bg-gray-50 dark:bg-gray-700 p-2.5 text-sm dark:text-white" placeholder="Siswa dapat mengidentifikasi..."></textarea></div>
                    </div>
                </div>

                <!-- 4. CHECKLISTS -->
                <div class="bg-white dark:bg-cardDark rounded-2xl shadow-sm p-6 border border-gray-100 dark:border-gray-800 space-y-6">
                    <div>
                        <h3 class="text-sm font-bold mb-2 text-primary border-b pb-1">DIMENSI PROFIL LULUSAN</h3>
                        <div class="grid grid-cols-2 gap-2 text-sm" id="chkProfil">
                            <label><input type="checkbox" value="Keimanan dan Ketakwaan" class="mr-2 rounded">Keimanan & Ketakwaan</label>
                            <label><input type="checkbox" value="Kewargaan" class="mr-2 rounded">Kewargaan</label>
                            <label><input type="checkbox" value="Penalaran Kritis" class="mr-2 rounded" checked>Penalaran Kritis</label>
                            <label><input type="checkbox" value="Kreativitas" class="mr-2 rounded" checked>Kreativitas</label>
                            <label><input type="checkbox" value="Kolaborasi" class="mr-2 rounded" checked>Kolaborasi</label>
                            <label><input type="checkbox" value="Kemandirian" class="mr-2 rounded">Kemandirian</label>
                            <label><input type="checkbox" value="Komunikasi" class="mr-2 rounded" checked>Komunikasi</label>
                            <label><input type="checkbox" value="Kesehatan" class="mr-2 rounded">Kesehatan</label>
                        </div>
                    </div>

                    <div>
                        <h3 class="text-sm font-bold mb-2 text-primary border-b pb-1">SARANA PRASARANA</h3>
                        <div class="grid grid-cols-3 gap-2 text-sm" id="chkSarpras">
                            <label><input type="checkbox" value="LCD" checked class="mr-1 rounded">LCD</label>
                            <label><input type="checkbox" value="Laptop" checked class="mr-1 rounded">Laptop</label>
                            <label><input type="checkbox" value="Internet" checked class="mr-1 rounded">Internet</label>
                            <label><input type="checkbox" value="Buku Teks" checked class="mr-1 rounded">Buku Teks</label>
                            <label><input type="checkbox" value="Youtube" class="mr-1 rounded">Youtube</label>
                            <label><input type="checkbox" value="Canva" class="mr-1 rounded">Canva</label>
                            <label><input type="checkbox" value="Quizizz" class="mr-1 rounded">Quizizz</label>
                            <label><input type="checkbox" value="Wordwall" class="mr-1 rounded">Wordwall</label>
                            <label><input type="checkbox" value="LKPD" checked class="mr-1 rounded">LKPD</label>
                            <label><input type="checkbox" value="Whiteboard" checked class="mr-1 rounded">Whiteboard</label>
                            <label><input type="checkbox" value="Google Classroom" class="mr-1 rounded">GCR</label>
                        </div>
                    </div>

                    <div>
                        <h3 class="text-sm font-bold mb-2 text-primary border-b pb-1">TARGET PESERTA DIDIK</h3>
                        <div class="grid grid-cols-2 gap-2 text-sm" id="chkTarget">
                            <label><input type="checkbox" value="Reguler" checked class="mr-2 rounded">Reguler</label>
                            <label><input type="checkbox" value="Kesulitan Belajar" class="mr-2 rounded">Kesulitan Belajar</label>
                            <label><input type="checkbox" value="Pencapaian Tinggi" class="mr-2 rounded">Pencapaian Tinggi</label>
                        </div>
                    </div>

                    <div>
                        <h3 class="text-sm font-bold mb-2 text-primary border-b pb-1">MODEL PEMBELAJARAN</h3>
                        <div class="grid grid-cols-2 gap-2 text-sm" id="chkModel">
                            <label><input type="checkbox" value="Inquiry" class="mr-2 rounded">Inquiry</label>
                            <label><input type="checkbox" value="Discovery Learning" class="mr-2 rounded">Discovery Learning</label>
                            <label><input type="checkbox" value="Problem Based Learning (PBL)" checked class="mr-2 rounded">PBL</label>
                            <label><input type="checkbox" value="Project Based Learning (PjBL)" class="mr-2 rounded">PjBL</label>
                            <label><input type="checkbox" value="Cooperative Learning" class="mr-2 rounded">Cooperative</label>
                            <label><input type="checkbox" value="Contextual Teaching Learning" class="mr-2 rounded">CTL</label>
                            <label><input type="checkbox" value="Game Based Learning" class="mr-2 rounded">Game Based</label>
                        </div>
                    </div>

                    <div>
                        <h3 class="text-sm font-bold mb-2 text-primary border-b pb-1">METODE PEMBELAJARAN</h3>
                        <div class="grid grid-cols-2 gap-2 text-sm" id="chkMetode">
                            <label><input type="checkbox" value="Ceramah" checked class="mr-2 rounded">Ceramah</label>
                            <label><input type="checkbox" value="Diskusi" checked class="mr-2 rounded">Diskusi</label>
                            <label><input type="checkbox" value="Tanya Jawab" checked class="mr-2 rounded">Tanya Jawab</label>
                            <label><input type="checkbox" value="Demonstrasi" class="mr-2 rounded">Demonstrasi</label>
                            <label><input type="checkbox" value="Eksperimen" class="mr-2 rounded">Eksperimen</label>
                            <label><input type="checkbox" value="Role Play" class="mr-2 rounded">Role Play</label>
                            <label><input type="checkbox" value="Studi Kasus" class="mr-2 rounded">Studi Kasus</label>
                            <label><input type="checkbox" value="Mind Mapping" class="mr-2 rounded">Mind Mapping</label>
                        </div>
                    </div>
                </div>

            </div>

            <div class="lg:col-span-7 flex flex-col h-[calc(100vh-8rem)]">
                <div class="bg-white dark:bg-cardDark p-4 rounded-t-2xl shadow-sm border border-gray-100 dark:border-gray-800 flex flex-wrap gap-2 justify-center z-10 shrink-0">
                    <button onclick="fillDummyData()" class="px-3 py-1.5 text-sm bg-gray-100 hover:bg-gray-200 dark:bg-gray-700 dark:hover:bg-gray-600 text-gray-700 dark:text-gray-200 rounded-lg transition font-medium flex items-center gap-1"><i class="fas fa-magic"></i> Isi Contoh</button>
                    <button onclick="saveData()" class="px-3 py-1.5 text-sm bg-teal-100 hover:bg-teal-200 text-teal-700 rounded-lg transition font-medium flex items-center gap-1"><i class="fas fa-save"></i> Simpan</button>
                    <button onclick="loadData()" class="px-3 py-1.5 text-sm bg-orange-100 hover:bg-orange-200 text-orange-700 rounded-lg transition font-medium flex items-center gap-1"><i class="fas fa-folder-open"></i> Muat</button>
                    <button onclick="resetForm()" class="px-3 py-1.5 text-sm bg-red-100 hover:bg-red-200 text-red-700 rounded-lg transition font-medium flex items-center gap-1"><i class="fas fa-trash"></i> Reset</button>
                    
                    <div class="w-full h-px bg-gray-200 dark:bg-gray-700 my-1"></div>
                    
                    <button onclick="generateRPM()" class="px-5 py-2 bg-gradient-to-r from-primary to-secondary hover:from-blue-700 hover:to-indigo-700 text-white rounded-lg transition font-bold shadow-md flex items-center gap-2"><i class="fas fa-cogs"></i> GENERATE RPM</button>
                    <button onclick="copyDoc()" class="px-3 py-2 text-sm bg-gray-800 hover:bg-gray-900 text-white rounded-lg transition font-medium"><i class="fas fa-copy"></i> Copy</button>
                    <button onclick="exportWord()" class="px-3 py-2 text-sm bg-blue-600 hover:bg-blue-700 text-white rounded-lg transition font-medium"><i class="fas fa-file-word"></i> Word</button>
                    <button onclick="printPDF()" class="px-3 py-2 text-sm bg-red-600 hover:bg-red-700 text-white rounded-lg transition font-medium"><i class="fas fa-file-pdf"></i> Cetak PDF</button>
                </div>

                <div class="bg-gray-200 dark:bg-gray-800 p-4 md:p-8 rounded-b-2xl shadow-inner flex-grow overflow-y-auto" id="preview-wrapper">
                    <div id="preview-container" class="max-w-[210mm] mx-auto bg-white shadow-2xl min-h-[297mm] p-8 md:p-12 doc-preview">
                        <div class="h-full flex flex-col items-center justify-center text-gray-400 opacity-50 pt-20 pb-20">
                            <i class="fas fa-file-signature text-6xl mb-4"></i>
                            <p class="text-xl font-bold">Area Dokumen RPM</p>
                            <p class="text-sm">Silakan lengkapi form dan klik Generate RPM</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="toast" class="fixed bottom-5 right-5 transform translate-y-20 opacity-0 transition-all duration-300 bg-gray-800 text-white px-4 py-3 rounded-lg shadow-xl z-50 flex items-center gap-3">
        <i class="fas fa-info-circle text-blue-400"></i><span id="toast-msg">Pesan...</span>
    </div>

    <script>
        const themeToggle = document.getElementById('themeToggle');
        const html = document.documentElement;
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) { html.classList.add('dark'); } else { html.classList.remove('dark'); }
        themeToggle.addEventListener('click', () => { html.classList.toggle('dark'); localStorage.setItem('theme', html.classList.contains('dark') ? 'dark' : 'light'); });

        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').textContent = message;
            toast.querySelector('i').className = type === 'success' ? 'fas fa-check-circle text-green-400' : 'fas fa-info-circle text-blue-400';
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => toast.classList.add('translate-y-20', 'opacity-0'), 3000);
        }

        function getChecked(id) { return Array.from(document.querySelectorAll(`#${id} input:checked`)).map(cb => cb.value); }
        function setChecked(id, arr) { document.querySelectorAll(`#${id} input`).forEach(cb => cb.checked = arr.includes(cb.value)); }

        function fillDummyData() {
            document.getElementById('namaGuru').value = "Budi Santoso, S.Pd."; document.getElementById('nipGuru').value = "19850723 201001 1 015";
            document.getElementById('namaKepsek').value = "Siti Aminah, M.Pd."; document.getElementById('nipKepsek').value = "19700321 199512 2 001";
            document.getElementById('namaSekolah').value = "SMP Negeri 1 Merdeka"; document.getElementById('mapel').value = "Ilmu Pengetahuan Alam (IPA)";
            document.getElementById('jenjang').value = "SMP"; document.getElementById('fase').value = "D";
            document.getElementById('kelas').value = "VII"; document.getElementById('semester').value = "Ganjil";
            document.getElementById('tahunPel').value = "2025/2026"; document.getElementById('waktu').value = "2 x 45 Menit";
            document.getElementById('topik').value = "Struktur Tumbuhan"; 
            document.getElementById('tp').value = "Peserta didik dapat mengidentifikasi bagian tubuh tumbuhan dan mendeskripsikan fungsinya dengan benar.";
            showToast('Data contoh berhasil diisi!', 'success');
        }

        function collectData() {
            return {
                guru: document.getElementById('namaGuru').value || '[Nama Guru]', nipG: document.getElementById('nipGuru').value || '[-]',
                kepsek: document.getElementById('namaKepsek').value || '[Nama Kepsek]', nipK: document.getElementById('nipKepsek').value || '[-]',
                sekolah: document.getElementById('namaSekolah').value || '[Nama Sekolah]', mapel: document.getElementById('mapel').value || '[Mata Pelajaran]',
                jenjang: document.getElementById('jenjang').value || '[Jenjang]', fase: document.getElementById('fase').value || '[Fase]',
                kelas: document.getElementById('kelas').value || '[Kelas]', smt: document.getElementById('semester').value || '[Semester]',
                tahun: document.getElementById('tahunPel').value || '[Tahun]', waktu: document.getElementById('waktu').value || '[Waktu]',
                topik: document.getElementById('topik').value || '[Topik]', tp: document.getElementById('tp').value || '[Tujuan Pembelajaran]',
                profil: getChecked('chkProfil'), sarpras: getChecked('chkSarpras'), target: getChecked('chkTarget'),
                model: getChecked('chkModel'), metode: getChecked('chkMetode')
            };
        }

        function saveData() { localStorage.setItem('rpmData', JSON.stringify(collectData())); showToast('Data tersimpan.', 'success'); }
        function loadData() {
            const saved = localStorage.getItem('rpmData');
            if (saved) {
                const d = JSON.parse(saved);
                document.getElementById('namaGuru').value = d.guru; document.getElementById('nipGuru').value = d.nipG;
                document.getElementById('namaKepsek').value = d.kepsek; document.getElementById('nipKepsek').value = d.nipK;
                document.getElementById('namaSekolah').value = d.sekolah; document.getElementById('mapel').value = d.mapel;
                document.getElementById('jenjang').value = d.jenjang; document.getElementById('fase').value = d.fase;
                document.getElementById('kelas').value = d.kelas; document.getElementById('semester').value = d.smt;
                document.getElementById('tahunPel').value = d.tahun; document.getElementById('waktu').value = d.waktu;
                document.getElementById('topik').value = d.topik; document.getElementById('tp').value = d.tp;
                setChecked('chkProfil', d.profil); setChecked('chkSarpras', d.sarpras); setChecked('chkTarget', d.target);
                setChecked('chkModel', d.model); setChecked('chkMetode', d.metode);
                showToast('Data dimuat!', 'success');
            } else { showToast('Tidak ada data tersimpan.'); }
        }
        function resetForm() { if(confirm('Reset semua form?')) { document.querySelectorAll('input[type="text"], textarea').forEach(el => el.value = ''); showToast('Form direset.'); } }

        // --- STREAMING_CHUNK:AI Generative Helpers ---
        function generateAutoCP(mapel, topik) { return `Pada akhir fase ini, peserta didik mampu mengidentifikasi dan menganalisis konsep dasar <b>${topik}</b> serta penerapannya secara kritis dan kolaboratif.`; }
        function generateLintasDisiplin(topik) { return `Pengintegrasian literasi (Bahasa Indonesia) dan numerasi (Matematika) dalam memahami ${topik}, serta penguatan karakter Pancasila.`; }
        function generatePemahamanBermakna(topik) { return `Mempelajari <b>${topik}</b> tidak hanya menghafal, melainkan menyadari prinsip ini bekerja dalam kehidupan nyata.`; }
        function generatePertanyaanPemantik(topik) { return `<ol style="margin:0;"><li>Pernahkah kalian mengamati fenomena <b>${topik}</b> di lingkungan sekitar?</li><li>Mengapa kita perlu mempelajari konsep ini?</li><li>Bagaimana pemahaman ini membantu menyelesaikan masalah?</li></ol>`; }
        
        function generatePesertaDidik(topik) {
            return `<ol style="margin:0;">
                <li><b>Pengetahuan Awal:</b> Siswa dapat mengidentifikasi konsep dasar ${topik.toLowerCase()}.</li>
                <li style="margin-top:8px;"><b>Minat Belajar:</b> Lebih mudah memahami jika disesuaikan dengan gaya belajar:
                    <ul><li><b>Visual:</b> Menggunakan gambar/diagram.</li><li><b>Auditori:</b> Mendengarkan penjelasan/video.</li><li><b>Kinestetik:</b> Kegiatan menyentuh/mengamati langsung.</li></ul>
                </li>
                <li style="margin-top:8px;"><b>Kebutuhan Belajar:</b> Menghubungkan materi dengan kehidupan sehari-hari (Meaningful Learning).</li>
            </ol>`;
        }

        function generateLangkahPembelajaran(metodeList) {
            return `<table>

        // --- STREAMING_CHUNK:Summative Assessment Generator (10 PG + 5 Essay) ---
        function generateSumatifRows(topik) {

                html += `<tr>
                    <td style="text-align: center; border: 1px solid #cbd5e1; padding: 10px;">${i}</td>
                    <td style="border: 1px solid #cbd5e1; padding: 10px;">Proses penting pada tahap ke-${i} dari siklus/konsep <b>${topik.toLowerCase()}</b> disebut...<br>A. Opsi Evaporasi<br>B. Opsi Kondensasi<br>C. Opsi Presipitasi<br>D. Opsi Infiltrasi</td>
                    <td style="border: 1px solid #cbd5e1; padding: 10px;">Kunci: B<br>(Bobot: 1)</td>
                </tr>`;
            }
            html += `<tr><td colspan="3" style="background-color: #f8fafc; font-weight: bold; padding: 10px; border: 1px solid #cbd5e1;">B. Isian Singkat / Esai (5 Soal)</td></tr>`;

                html += `<tr>
                    <td style="text-align: center; border: 1px solid #cbd5e1; padding: 10px;">${j}</td>
                    <td style="border: 1px solid #cbd5e1; padding: 10px;">Jelaskan analisis kritis Anda terkait permasalahan no.${j} pada materi <b>${topik}</b>!</td>
                    <td style="border: 1px solid #cbd5e1; padding: 10px;">Penjelasan logis.<br>(Bobot: 2)</td>
                </tr>`;
            }
            return html;
        }

        // --- STREAMING_CHUNK:Export Functions ---
        function copyDoc() {
            const container = document.getElementById('preview-container');
            if(container.innerText.includes('Area Dokumen RPM')) return showToast('Generate RPM terlebih dahulu!');
            const range = document.createRange(); range.selectNode(container); window.getSelection().removeAllRanges(); window.getSelection().addRange(range);
            try { document.execCommand('copy'); window.getSelection().removeAllRanges(); showToast('Berhasil dicopy! Paste (Ctrl+V) di Word.', 'success'); } 
            catch(e) { showToast('Gagal mencopy text.', 'error'); }
        }

        function exportWord() {
            const container = document.getElementById('preview-container');
            if(container.innerText.includes('Area Dokumen RPM')) return showToast('Generate RPM terlebih dahulu!');
            const header = "<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset='utf-8'><title>Export HTML To Doc</title><style>table{border-collapse: collapse; width:100%;} th, td{border: 1px solid black; padding: 5px;}</style></head><body>";
            const sourceHTML = header + container.innerHTML + "</body></html>";
            const source = 'data:application/vnd.ms-word;charset=utf-8,' + encodeURIComponent(sourceHTML);
            const fileDownload = document.createElement("a"); document.body.appendChild(fileDownload);
            fileDownload.href = source; fileDownload.download = `RPM_Kurmer_${document.getElementById('mapel').value}.doc`;
            fileDownload.click(); document.body.removeChild(fileDownload); showToast('Dokumen Word berhasil diunduh!', 'success');
        }

        function printPDF() {
            const container = document.getElementById('preview-container');
            if(container.innerText.includes('Area Dokumen RPM')) return showToast('Generate RPM terlebih dahulu!');
            window.print();
        }
